[general]
version                  = "0.7.3"
time_zone                = "utc-8"

[network]
server_address           = "0.0.0.0"
postgres_port            = 5432
http_port                = 23820
client_port              = 23817
connection_pool_size     = 128

[log]
log_filename             = "infinity.log"
log_dir                  = "/var/infinity/log"
log_to_stdout            = false
log_file_max_size        = "10GB"
log_file_rotate_count    = 10

# trace/debug/info/warning/error/critical 6 log levels, default: info
log_level               = "info"

[storage]
persistence_dir         = "/var/infinity/persistence"
data_dir                = "/var/infinity/data"
catalog_dir             = "/var/infinity/catalog"
# periodically activates garbage collection:
# 0 means real-time,
# s means seconds, for example "60s", 60 seconds
# m means minutes, for example "60m", 60 minutes
# h means hours, for example "1h", 1 hour
optimize_interval        = "10s"
cleanup_interval         = "60s"
compact_interval         = "120s"
storage_type             = "local"

# dump memory index entry when it reachs the capacity
mem_index_capacity       = 65536

# S3 storage config example:
# [storage.object_storage]
# url                      = "127.0.0.1:9005"
# bucket_name              = "infinity"
# access_key               = "minioadmin"
# secret_key               = "minioadmin"
# enable_https             = false

snapshot_dir            = "/var/infinity/snapshots"

[buffer]
buffer_manager_size      = "4GB"
lru_num                  = 7
temp_dir                 = "/var/infinity/tmp"
result_cache             = "off"
memindex_memory_quota    = "1GB"

[wal]
wal_dir                       = "/var/infinity/wal"
checkpoint_interval      = "86400s"
wal_compact_threshold         = "1GB"

# WAL durability level. One sync is performed per batch of committed transactions, so
# under concurrent load the cost is amortised; a single serial client pays it per commit.
# Measured per sync on an Apple internal SSD:
#
#   full_fsync  fsync + F_FULLFSYNC. Survives power loss. ~2.3 ms.
#               On macOS plain fsync returns before the drive flushes its own write cache,
#               so F_FULLFSYNC is what actually makes a commit durable.
#   fsync       fsync only. Survives an OS crash, NOT power loss. ~28 us.
#   no_sync     No sync. Survives the process dying, not the machine. ~1.5 us.
#               For benchmarks and throwaway data only.
#
# Default is full_fsync: this WAL is the engine's only durability mechanism (RocksDB's own
# WAL is disabled), so a weaker level means an acknowledged commit can disappear.
#
# The legacy names flush_at_once / flush_per_second / only_write are still accepted and map
# to full_fsync / fsync / no_sync respectively. Note that previously ALL THREE behaved
# identically and none of them synced at all.
wal_flush                     = "full_fsync"

[resource]
resource_dir                  = "/usr/share/infinity/resource"
