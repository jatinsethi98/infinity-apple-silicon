name: release

# Publish a macOS arm64 tarball for a tagged version.
#
# This replaces the upstream `release` workflow, which was inherited by this fork and
# failed every night. It failed for three independent reasons, all of which are
# structural rather than fixable:
#
#   1. It cross-compiled Linux x86-64 (-v2/-v3/-v4) and Linux arm64 inside
#      `infiniflow/infinity-x64-*-builder` images. This fork is arm64-apple-darwin
#      only and its Linux build is not re-verified after the port, so those jobs
#      cannot pass here.
#   2. It pushed images to the `infiniflow/infinity` Docker Hub repository and
#      published to PyPI using `secrets.DOCKERHUB_TOKEN` and `secrets.PYPI_API_TOKEN`,
#      neither of which a fork has, and neither of which a fork should have.
#   3. It ran on a nightly `schedule:` cron and force-pushed a mutable `nightly` tag.
#      A fork inheriting that cron produces one failed run and one notification
#      email per day forever.
#
# Deliberately NOT on a schedule. A cold macOS-runner build here is roughly an hour
# and macOS runner minutes bill at a multiplier, so releases are cut from tags on
# purpose. Use `workflow_dispatch` for a one-off unversioned build.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    # macos-15 is arm64. Do not switch to a macos-*-large runner: those are x86_64
    # and would produce a package that cannot run on the platform this fork targets.
    runs-on: macos-15
    timeout-minutes: 180

    env:
      LLVM_PREFIX: /opt/homebrew/opt/llvm@20
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - name: Check out, including the resource submodule
        uses: actions/checkout@v4
        with:
          # resource/ carries the full-text analyzer dictionaries. A package built
          # without them ships broken CJK full-text search, so this is not optional.
          submodules: true
          fetch-depth: 1

      - name: Verify the runner is arm64
        run: |
          set -eux
          test "$(uname -m)" = arm64

      - name: Install toolchain
        run: |
          set -eux
          # llvm@20 specifically: the project hard-fails below clang 20 and needs a
          # libc++ whose module manifest matches. Apple Clang is not usable.
          # bison 3.7+ is required by vcpkg's thrift port; macOS ships 2.3.
          brew install llvm@20 ninja libomp bison pkg-config
          brew install cmake || brew upgrade cmake
          "$LLVM_PREFIX/bin/clang++" --version
          cmake --version
          /opt/homebrew/opt/bison/bin/bison --version | head -1

      - name: Resolve the pinned vcpkg baseline
        id: baseline
        run: |
          set -eux
          baseline=$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json | head -1)
          test -n "$baseline"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-arm64-osx-${{ steps.baseline.outputs.baseline }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/arm64-osx.cmake', 'ports/**') }}
          restore-keys: |
            vcpkg-arm64-osx-${{ steps.baseline.outputs.baseline }}-
            vcpkg-arm64-osx-

      - name: Bootstrap vcpkg at the pinned baseline
        run: |
          set -eux
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          # Manifest mode must be able to `git show <baseline>:versions/baseline.json`,
          # which a plain shallow clone cannot do: the baseline commit is a graft
          # without its tree. Fetch that one commit explicitly.
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth=1 origin '${{ steps.baseline.outputs.baseline }}'
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          git -C "$VCPKG_ROOT" show '${{ steps.baseline.outputs.baseline }}:versions/baseline.json' >/dev/null
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build the server
        run: |
          set -eux
          scripts/apple_silicon/build_server.sh macos-arm64-release infinity

      - name: Confirm the binary is arm64
        run: |
          set -eux
          test "$(lipo -archs build/macos-arm64-release/src/infinity)" = arm64

      - name: Reclaim disk before packaging
        run: |
          set -eux
          # A hosted arm64 macOS runner has ~14 GB free and this build tree is ~11 GB,
          # of which ~10 GB is object files and C++23 module BMIs that are dead once
          # linked. The tarball does not fit alongside them.
          df -h . | tail -1
          find build/macos-arm64-release -name '*.o' -delete
          find build/macos-arm64-release -name '*.pcm' -delete
          rm -rf "$VCPKG_ROOT"
          test -x build/macos-arm64-release/src/infinity
          df -h . | tail -1

      - name: Install sqllogictest
        # The package self-test's query check needs it; without it the check silently
        # degrades to "the server started". --require-slt below makes that fatal.
        run: scripts/apple_silicon/install_test_tools.sh

      - name: Package and self-test the tarball
        # make_package.sh extracts the tarball to a scratch directory, starts the
        # server out of it and runs a query. An artifact that has never been started
        # is not an artifact that works, so this is the release gate. For a tag the
        # package is named after the tag (v0.7.3-apple.2 -> infinity-0.7.3-apple.2-...),
        # so successive releases of the same engine version install side by side.
        run: |
          set -eux
          case "$GITHUB_REF" in
            refs/tags/v*) scripts/apple_silicon/make_package.sh --require-slt --version "${GITHUB_REF_NAME#v}" ;;
            *)            scripts/apple_silicon/make_package.sh --require-slt ;;
          esac

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinity-macos-arm64
          path: |
            build/package/*.tar.gz
            build/package/*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/package/*.tar.gz
            build/package/*.tar.gz.sha256
