name: Feature request
description: Propose something for the Mac port, its tooling or its docs
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: scope
    attributes:
      label: What is this about?
      description: Engine and SQL features belong upstream, where they help every platform; this repository is the port, its scripts, packaging, benchmarks and documentation.
      options:
        - The Mac port, build, packaging or scripts
        - Benchmarks or performance on Apple Silicon
        - Documentation, demo or examples
        - Infinity's engine or SQL (I will file upstream if you say so)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour, command, page or number you want to exist. Alternatives you considered are welcome.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this.
