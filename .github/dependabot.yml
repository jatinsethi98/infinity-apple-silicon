# Keep the GitHub Actions this repository uses current. Only actions are covered:
# the C++ dependencies are pinned through vcpkg.json's baseline on purpose, and the
# Python SDK's pins are upstream's.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "ci"
